<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>
<style>
:root{--bg:#070b16;--text:#eef4ff;--muted:#91a0ba;--line:rgba(255,255,255,.1);--accent:#8b7cff;--accent2:#63a4ff}
*{box-sizing:border-box}
html,body{height:100%}
body{height:100vh;height:100dvh}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:flex;flex-direction:column;
background:radial-gradient(circle at 15% 10%,rgba(139,124,255,.22),transparent 34%),radial-gradient(circle at 85% 85%,rgba(99,164,255,.16),transparent 34%),var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 6%;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.logo{font-size:21px;font-weight:850;letter-spacing:-.5px}.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font-size:12px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line)}
#chat{flex:1;overflow-y:auto;padding:24px 6%;display:flex;flex-direction:column;gap:14px;width:min(820px,100%);margin:0 auto}
.msg{max-width:82%;padding:12px 16px;border-radius:18px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bot{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.chips{display:flex;gap:8px;flex-wrap:wrap;width:min(820px,100%);margin:0 auto;padding:0 6% 10px}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
form{display:flex;gap:10px;width:min(820px,100%);margin:0 auto;padding:6px 6% 22px}
input{flex:1;min-width:0;background:rgba(17,25,45,.85);border:1px solid var(--line);border-radius:16px;color:var(--text);font:inherit;font-size:16px;padding:14px 16px;outline:0}
input:focus{border-color:var(--accent)}
button.send{border:0;border-radius:14px;padding:0 22px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:15px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.reveal{position:fixed;inset:0;background:rgba(3,6,14,.8);backdrop-filter:blur(8px);display:none;place-items:center;z-index:20;padding:20px}
.reveal.show{display:grid}
.reveal div{max-width:420px;text-align:center;background:#11192d;border:1px solid var(--line);border-radius:22px;padding:34px}
.reveal h2{font-size:34px;margin:0 0 10px;letter-spacing:-1px}.reveal p{color:var(--muted);line-height:1.6;margin:0 0 22px}
.reveal .send{padding:13px 22px}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Nova <span>AI</span></div>
  <div class="pill">● Online</div>
</header>

<div id="chat" aria-live="polite"></div>

<div class="chips" id="chips">
  <button class="chip" type="button">Tell me a joke</button>
  <button class="chip" type="button">Help with homework</button>
  <button class="chip" type="button">Who are you?</button>
</div>

<form id="form" autocomplete="off">
  <input id="input" placeholder="Message Nova AI…" aria-label="Message" enterkeyhint="send">
  <button class="send" id="sendBtn" type="button">Send</button>
</form>

<div class="reveal" id="reveal" role="dialog" aria-modal="true">
  <div>
    <h2>Gotcha 😄</h2>
    <p>Nova AI isn't a real AI. Every reply was pre-written, and nothing you typed was saved or sent anywhere.</p>
    <button class="send" onclick="document.getElementById('reveal').classList.remove('show')">Okay, you got me</button>
  </div>
</div>

<script>
// The "Gotcha" popup appears after this many messages. Set to 0 to turn it off.
const REVEAL_AFTER=4;

const $=id=>document.getElementById(id);
const chat=$("chat");
let count=0, busy=false;

const replies=[
  [/\b(hi|hello|hey|yo|sup)\b/i,["Hey! I'm Nova AI. What can I help you with today?","Hello! Ask me anything."]],
  [/joke/i,["Why did the computer go to the doctor? It had a virus. 🤒","I'd tell you a UDP joke, but you might not get it."]],
  [/homework|essay|study|math|school/i,["Happy to help! Tell me the subject and what you're stuck on, and we'll break it down step by step. 📚"]],
  [/who are you|your name|what are you/i,["I'm Nova AI, your personal assistant, built to be fast and friendly. ✨"]],
  [/vpn|proxy|unblock/i,["Great question! Privacy matters. Have you tried NovaVPN+? 😉"]],
  [/thank/i,["Anytime! 😊"]],
  [/weather/i,["I can't see outside, but I'm told it's a great day to be indoors. ☁️"]],
  [/\?$/,["Interesting question. Let me think about that… I'd say it depends, but you're on the right track.","Good one! There are a few ways to look at that. Can you tell me a bit more?"]]
];
const fallback=["That's really interesting. Tell me more!","Got it. I'm processing that now… ✨","I see what you mean. What would you like to do next?","Nice. Want me to go deeper on that?"];

function add(text,cls){
  const d=document.createElement("div"); d.className="msg "+cls; d.textContent=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function answer(t){
  for(const [re,opts] of replies) if(re.test(t)) return pick(opts);
  return pick(fallback);
}
function sendMsg(text){
  text=text.trim(); if(!text||busy) return;
  busy=true; $("chips").style.display="none";
  add(text,"me"); count++;
  const typing=add("","bot"); typing.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  setTimeout(()=>{
    typing.textContent=answer(text); chat.scrollTop=chat.scrollHeight; busy=false;
    if(REVEAL_AFTER>0&&count===REVEAL_AFTER) setTimeout(()=>$("reveal").classList.add("show"),900);
  },900+Math.random()*900);
}
function submitInput(){const v=$("input").value;if(!v.trim())return;$("input").value="";sendMsg(v)}
$("form").addEventListener("submit",e=>{e.preventDefault();submitInput()});
$("sendBtn").addEventListener("click",submitInput);
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submitInput()}});
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>sendMsg(c.textContent)));
add("Hi, I'm Nova AI. Ask me anything! ✨","bot");
</script>
</body>
</html>
